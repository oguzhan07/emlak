<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;font-family:'Inter',sans-serif;overflow:hidden;background:#1B2A4A}

.header{height:60px;padding:0 36px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.05)}
.logo{height:38px}
.badge{padding:6px 16px;font-size:11px;font-weight:800;letter-spacing:2px;background:#C5A355;color:#1B2A4A;border-radius:3px}

.main{display:grid;grid-template-columns:55% 45%;height:calc(100% - 60px - 90px)}
.img-side{position:relative}
.img-main{width:100%;height:100%;background-size:cover;background-position:center}
.img-overlay{position:absolute;inset:0;background:linear-gradient(90deg,transparent 60%,#1B2A4A 100%)}
.price-tag{position:absolute;bottom:28px;left:28px;background:rgba(197,163,85,0.95);padding:10px 24px;border-radius:6px}
.price-value{font-size:28px;font-weight:800;color:#1B2A4A}

.info-side{padding:32px 36px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.prop-type{font-size:11px;font-weight:700;color:#C5A355;letter-spacing:3px;text-transform:uppercase}
.title{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:white;line-height:1.25}
.location{font-size:12px;color:rgba(255,255,255,0.5);font-weight:500}

.features-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.feat-box{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:12px;text-align:center}
.feat-value{font-size:18px;font-weight:800;color:#C5A355}
.feat-label{font-size:10px;color:rgba(255,255,255,0.5);margin-top:2px;font-weight:500;text-transform:uppercase;letter-spacing:0.5px}

.footer{height:90px;padding:0 36px;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.2)}
.agent{display:flex;align-items:center;gap:12px}
.agent-photo{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid #C5A355}
.agent-name{font-size:14px;font-weight:700;color:white}
.agent-phone{font-size:12px;color:#8899AA}
.contact{text-align:right}
.contact-label{font-size:10px;color:#C5A355;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.contact-value{font-size:13px;color:white;font-weight:500}
</style></head>
<body>
  <div class="header">
    <img class="logo" data-field="logo" src="">
    <div class="badge" data-field="listingType">SATILIK</div>
  </div>
  <div class="main">
    <div class="img-side">
      <div class="img-main" data-bg="primaryImage"></div>
      <div class="img-overlay"></div>
      <div class="price-tag">
        <div class="price-value" data-field="price">0 TL</div>
      </div>
    </div>
    <div class="info-side">
      <div class="prop-type" data-field="propertyType">Daire</div>
      <div class="title" data-field="title">İlan Başlığı</div>
      <div class="location" data-field="location">Konum bilgisi</div>
      <div class="features-grid">
        <div class="feat-box"><div class="feat-value" data-field="roomCount">3+1</div><div class="feat-label">Oda</div></div>
        <div class="feat-box"><div class="feat-value" data-field="area">120 m²</div><div class="feat-label">Alan</div></div>
        <div class="feat-box"><div class="feat-value" data-field="floor">3. Kat</div><div class="feat-label">Kat</div></div>
        <div class="feat-box"><div class="feat-value" data-field="bathroom">2</div><div class="feat-label">Banyo</div></div>
      </div>
    </div>
  </div>
  <div class="footer">
    <div class="agent">
      <img class="agent-photo" data-field="agentPhoto" src="">
      <div>
        <div class="agent-name" data-field="agentName">İsim Soyisim</div>
        <div class="agent-phone" data-field="agentPhone">+90 5XX</div>
      </div>
    </div>
    <div class="contact">
      <div class="contact-label">İletişim</div>
      <div class="contact-value" data-field="agentInstagram">@instagram</div>
    </div>
  </div>
</body></html>
