<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>20 Kasim - Dunya Cocuk Haklari Gunu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    background: #FDF8F0;
    position: relative;
  }

  /* Soft warm background */
  .bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(160deg, #FDF8F0 0%, #FFF5E6 30%, #FDF8F0 60%, #F5F0FF 100%);
  }

  /* Colorful circles - child-friendly */
  .circle {
    position: absolute;
    border-radius: 50%;
  }
  .circle-1 {
    width: 200px; height: 200px;
    top: -40px; right: -30px;
    background: linear-gradient(135deg, rgba(255, 183, 77, 0.25) 0%, rgba(255, 183, 77, 0.08) 100%);
  }
  .circle-2 {
    width: 160px; height: 160px;
    top: 80px; left: -40px;
    background: linear-gradient(135deg, rgba(129, 199, 245, 0.2) 0%, rgba(129, 199, 245, 0.05) 100%);
  }
  .circle-3 {
    width: 120px; height: 120px;
    bottom: 300px; right: 60px;
    background: linear-gradient(135deg, rgba(186, 148, 209, 0.2) 0%, rgba(186, 148, 209, 0.05) 100%);
  }
  .circle-4 {
    width: 90px; height: 90px;
    top: 300px; left: 80px;
    background: linear-gradient(135deg, rgba(129, 209, 166, 0.2) 0%, rgba(129, 209, 166, 0.05) 100%);
  }
  .circle-5 {
    width: 60px; height: 60px;
    top: 200px; right: 150px;
    background: linear-gradient(135deg, rgba(255, 138, 138, 0.2) 0%, rgba(255, 138, 138, 0.05) 100%);
  }

  /* Stars - CSS only */
  .star {
    position: absolute;
    width: 0; height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-bottom: 22px solid #C5A355;
    opacity: 0.15;
  }
  .star::after {
    content: '';
    position: absolute;
    top: 8px;
    left: -12px;
    width: 0; height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 22px solid #C5A355;
  }
  .star-1 { top: 100px; right: 180px; transform: scale(0.7) rotate(10deg); opacity: 0.12; }
  .star-2 { top: 220px; left: 200px; transform: scale(0.5) rotate(-15deg); opacity: 0.1; }
  .star-3 { bottom: 350px; left: 120px; transform: scale(0.6) rotate(20deg); opacity: 0.1; }
  .star-4 { top: 400px; right: 100px; transform: scale(0.4) rotate(-5deg); opacity: 0.12; }
  .star-5 { bottom: 400px; right: 250px; transform: scale(0.55) rotate(30deg); opacity: 0.08; }

  /* Small colored dots */
  .dot {
    position: absolute;
    border-radius: 50%;
  }
  .dot-1 { width: 10px; height: 10px; top: 160px; left: 300px; background: rgba(255,183,77,0.3); }
  .dot-2 { width: 8px; height: 8px; top: 350px; right: 200px; background: rgba(129,199,245,0.3); }
  .dot-3 { width: 12px; height: 12px; bottom: 320px; left: 250px; background: rgba(186,148,209,0.25); }
  .dot-4 { width: 6px; height: 6px; top: 500px; left: 150px; background: rgba(255,138,138,0.3); }
  .dot-5 { width: 9px; height: 9px; top: 280px; right: 100px; background: rgba(129,209,166,0.3); }

  /* Playful ring shapes */
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 3px solid;
  }
  .ring-1 {
    width: 50px; height: 50px;
    top: 130px; left: 130px;
    border-color: rgba(255,183,77,0.15);
  }
  .ring-2 {
    width: 35px; height: 35px;
    top: 450px; right: 160px;
    border-color: rgba(129,199,245,0.15);
  }
  .ring-3 {
    width: 45px; height: 45px;
    bottom: 350px; right: 100px;
    border-color: rgba(186,148,209,0.12);
  }

  /* Navy accent bar top */
  .top-bar {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 6px;
    background: linear-gradient(90deg, #FFB74D, #81C7F5, #BA94D1, #81D1A6, #FF8A8A, #C5A355);
  }

  /* Logo */
  .logo-area {
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    height: 45px;
  }
  .logo-area img {
    height: 100%;
    width: auto;
  }

  /* Date */
  .date-text {
    position: absolute;
    top: 180px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: #1B2A4A;
    letter-spacing: 6px;
    text-transform: uppercase;
    opacity: 0.5;
  }

  /* Number 20 large */
  .big-number {
    position: absolute;
    top: 200px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Playfair Display', serif;
    font-size: 180px;
    font-weight: 700;
    color: rgba(27, 42, 74, 0.06);
    line-height: 1;
    letter-spacing: -5px;
  }

  /* Main title */
  .main-text {
    position: absolute;
    top: 280px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    width: 800px;
  }
  .main-text .pre-title {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 500;
    color: #C5A355;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .main-text h1 {
    font-family: 'Playfair Display', serif;
    font-size: 52px;
    font-weight: 700;
    color: #1B2A4A;
    line-height: 1.3;
    letter-spacing: 1px;
  }
  .main-text h1 .highlight {
    color: #C5A355;
  }

  /* Gold divider */
  .divider {
    position: absolute;
    top: 520px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 2px;
    background: #C5A355;
    opacity: 0.5;
  }

  /* Subtitle message */
  .subtitle {
    position: absolute;
    top: 550px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    width: 700px;
  }
  .subtitle p {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 400;
    font-style: italic;
    color: rgba(27, 42, 74, 0.6);
    line-height: 1.6;
  }

  /* Bottom colored bar */
  .bottom-accent {
    position: absolute;
    bottom: 180px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
  }
  .accent-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  .accent-dot:nth-child(1) { background: #FFB74D; opacity: 0.5; }
  .accent-dot:nth-child(2) { background: #81C7F5; opacity: 0.5; }
  .accent-dot:nth-child(3) { background: #BA94D1; opacity: 0.5; }
  .accent-dot:nth-child(4) { background: #81D1A6; opacity: 0.5; }
  .accent-dot:nth-child(5) { background: #FF8A8A; opacity: 0.5; }

  /* Agent section */
  .agent-section {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 170px;
    background: linear-gradient(180deg, transparent 0%, rgba(27,42,74,0.04) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding-top: 10px;
  }
  .agent-photo-wrapper {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    border: 2px solid #C5A355;
    overflow: hidden;
    flex-shrink: 0;
  }
  .agent-photo-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .agent-info {
    text-align: left;
  }
  .agent-info .name {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: #1B2A4A;
    letter-spacing: 0.5px;
  }
  .agent-info .phone {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: rgba(27,42,74,0.5);
    letter-spacing: 0.5px;
    margin-top: 4px;
  }
  .logo-bottom {
    position: absolute;
    bottom: 35px;
    right: 55px;
    height: 34px;
  }
  .logo-bottom img {
    height: 100%;
    width: auto;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="top-bar"></div>

  <!-- Circles -->
  <div class="circle circle-1"></div>
  <div class="circle circle-2"></div>
  <div class="circle circle-3"></div>
  <div class="circle circle-4"></div>
  <div class="circle circle-5"></div>

  <!-- Stars -->
  <div class="star star-1"></div>
  <div class="star star-2"></div>
  <div class="star star-3"></div>
  <div class="star star-4"></div>
  <div class="star star-5"></div>

  <!-- Dots -->
  <div class="dot dot-1"></div>
  <div class="dot dot-2"></div>
  <div class="dot dot-3"></div>
  <div class="dot dot-4"></div>
  <div class="dot dot-5"></div>

  <!-- Rings -->
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="ring ring-3"></div>

  <!-- Logo -->
  <div class="logo-area">
    <img data-field="logoNavy" src="" alt="Logo">
  </div>

  <!-- Date -->
  <div class="date-text">20 Kasim</div>
  <div class="big-number">20</div>

  <!-- Main text -->
  <div class="main-text">
    <div class="pre-title">Dunya</div>
    <h1>Cocuk <span class="highlight">Haklari</span><br>Gunu</h1>
  </div>

  <div class="divider"></div>

  <div class="subtitle">
    <p>Tum cocuklarin haklarina kavustugu<br>bir dunya icin...</p>
  </div>

  <!-- Bottom accent dots -->
  <div class="bottom-accent">
    <div class="accent-dot"></div>
    <div class="accent-dot"></div>
    <div class="accent-dot"></div>
    <div class="accent-dot"></div>
    <div class="accent-dot"></div>
  </div>

  <!-- Agent section -->
  <div class="agent-section">
    <div class="agent-photo-wrapper">
      <img data-field="agentPhoto" src="" alt="Agent">
    </div>
    <div class="agent-info">
      <div class="name" data-field="agentName"></div>
      <div class="phone" data-field="agentPhone"></div>
    </div>
    <div class="logo-bottom">
      <img data-field="logoNavy" src="" alt="Logo">
    </div>
  </div>
</body>
</html>
